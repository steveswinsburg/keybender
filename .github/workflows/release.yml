name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string

jobs:
  release:
    name: Build and publish release
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: version must be in semver format (e.g. 1.0.0)"
            exit 1
          fi

      - name: Build release binary
        run: swift build -c release

      - name: Package binary
        run: |
          mkdir -p dist
          cp .build/release/KeyBender dist/KeyBender
          cd dist
          zip KeyBender.zip KeyBender
          shasum -a 256 KeyBender.zip > KeyBender.zip.sha256

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            dist/KeyBender.zip \
            dist/KeyBender.zip.sha256 \
            --title "KeyBender v${{ inputs.version }}" \
            --generate-notes
