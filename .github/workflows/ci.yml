name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and verify
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test 2>/dev/null || echo "No tests found"
